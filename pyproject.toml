[project]
name = "iconograph"
version = "0.1.0"
description = "Convert logos into Fedora hicolor icon sets — abstract pixelated logo + monogram per source."
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "scikit-image",
    "numpy",
    "Pillow",
    "scikit-learn",
    "pyphen",   # stage-5 monogram: dictionary hyphenation → syllable onsets (deterministic, H8)
]

[project.optional-dependencies]
diff = ["torch"]   # diff_fit refiner only — lazily imported; CPU wheel suffices (no CUDA/ROCm on this box)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
